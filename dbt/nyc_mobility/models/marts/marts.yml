version: 2

models:
  - name: mart_daily_trips
    description: "Tabela agregada com métricas diárias das viagens de táxi."

    columns:
      - name: trip_date
        description: "Data de início das viagens."
        tests:
          - not_null

      - name: total_trips
        description: "Quantidade total de viagens iniciadas no dia."
        tests:
          - not_null

      - name: valid_revenue
        description: "Receita total das viagens com valores considerados válidos."

      - name: avg_trip_distance
        description: "Distância média das viagens iniciadas no dia, em milhas."

      - name: avg_trip_duration
        description: "Duração média das viagens iniciadas no dia, em minutos."

  - name: mart_yellow_trips
    description: "Tabela analítica com dados individuais das viagens de táxi amarelo."

    columns:
      - name: trip_id
        description: "Identificador técnico único da viagem gerado no modelo analítico."
        tests:
          - not_null
          - unique
          
      - name: vendor_id
        description: "Identificador do provedor do serviço de táxi."

      - name: tpep_pickup_datetime
        description: "Data e hora de início da viagem."
        tests:
          - not_null

      - name: tpep_dropoff_datetime
        description: "Data e hora de término da viagem."
        tests:
          - not_null

      - name: passenger_count
        description: "Quantidade de passageiros registrada na viagem."

      - name: trip_distance
        description: "Distância percorrida durante a viagem, em milhas."

      - name: pu_location_id
        description: "Identificador da zona de embarque."

      - name: do_location_id
        description: "Identificador da zona de desembarque."

      - name: payment_type
        description: "Código do tipo de pagamento utilizado."

      - name: fare_amount
        description: "Valor da tarifa da viagem."

      - name: tip_amount
        description: "Valor da gorjeta registrada."

      - name: total_amount
        description: "Valor total registrado para a viagem."
        tests:
          - not_null

      - name: trip_duration_minutes
        description: "Duração da viagem calculada em minutos."

      - name: average_speed_mph
        description: "Velocidade média estimada da viagem em milhas por hora."

      - name: distance_quality
        description: "Classificação da distância da viagem. Viagens acima de 100 milhas são classificadas como suspeitas."

      - name: amount_quality
        description: "Classificação do valor total da viagem. Valores negativos são classificados como suspeitos."